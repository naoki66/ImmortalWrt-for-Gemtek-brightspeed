# Wireless multi-interface resource tuning for 13+ WiFi interfaces (MLO).
#
# The hostapd netlink receive buffer is capped by rmem_max. Raise the socket
# limits and backlog so restart bursts do not lose key-management messages.

fs.file-max=524288

net.core.rmem_max=1048576
net.core.wmem_max=1048576
net.core.rmem_default=262144
net.core.wmem_default=262144

net.core.netdev_max_backlog=2000
