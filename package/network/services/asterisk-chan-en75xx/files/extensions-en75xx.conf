;
; Minimal local dial plan for the XG2010G FXS line.
;

[fxs]
exten => 1001,1,Dial(EN75XX/0,30)
 same  =>      n,Hangup()
; Bidirectional PCM and echo-path test without external sound files.
exten => 600,1,Answer()
 same  =>     n,Echo()
 same  =>     n,Hangup()

[from-trunk]
exten => s,1,Dial(EN75XX/0,30)
 same  =>   n,Hangup()
