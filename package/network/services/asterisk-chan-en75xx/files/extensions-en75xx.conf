;
; Minimal local dial plan for the XG2010G FXS line.
;

[fxs]
exten => 1001,1,Dial(EN75XX/0,30)
 same  =>      n,Hangup()
; Bidirectional PCM and echo-path test without external sound files.
exten => 600,1,Answer()
 same  =>     n,Echo()
 same  =>     n,Hangup()

; Packaged voice prompt playback test.
exten => 601,1,Answer()
 same  =>     n,Playback(demo-congrats)
 same  =>     n,Hangup()

; Record up to ten seconds, stop after three seconds of silence, then replay.
exten => 602,1,Answer()
 same  =>     n,Record(/tmp/en75xx-recording.wav,3,10,k)
 same  =>     n,Playback(/tmp/en75xx-recording)
 same  =>     n,Hangup()

; Six 450 Hz cadence beeps without routing microphone audio back to the handset.
exten => 603,1,Answer()
 same  =>     n,PlayTones(450/200,0/200)
 same  =>     n,Wait(2.4)
 same  =>     n,StopPlayTones()
 same  =>     n,Hangup()

; Exercise the MusicOnHold playlist engine with packaged Asterisk audio.
exten => 604,1,Answer()
 same  =>     n,MusicOnHold(en75xx-test,10)
 same  =>     n,Hangup()

[from-trunk]
exten => s,1,Dial(EN75XX/0,30)
 same  =>   n,Hangup()
