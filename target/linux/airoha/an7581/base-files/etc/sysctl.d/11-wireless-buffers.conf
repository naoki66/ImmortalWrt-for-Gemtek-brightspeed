# Wireless multi-interface resource tuning for 13+ WiFi interfaces (MLO).
#
# 1. "No buffer space available" on netlink recv:
#    The hostapd netlink patch (070-netlink-increase-buffer-size.patch) sets
#    SO_RCVBUF to 262144, but the kernel caps this at rmem_max. Without
#    raising rmem_max, the buffer request is silently clamped down.
#
# 2. "key addition failed":
#    Consequence of netlink buffer exhaustion — key add commands time out.
#
# 3. "Failed to create interface: -23 (Too many open files in system)":
#    Despite the misleading strerror, -23 (ENFILE) here is NOT a file
#    descriptor issue. In net/mac80211/iface.c, dev_alloc_name() returns
#    -ENFILE when the interface name already exists (duplicate name race
#    during restart). This is transient — interfaces come up after cleanup.
#    fs.file-max is raised anyway for general system headroom.

fs.file-max=524288

net.core.rmem_max=1048576
net.core.wmem_max=1048576
net.core.rmem_default=262144
net.core.wmem_default=262144

net.core.netdev_max_backlog=2000
